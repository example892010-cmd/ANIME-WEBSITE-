name: ANIFLIX Network Tamil - Build Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  website-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository smoke checks
        run: npm run smoke
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript type check
        run: npx tsc --noEmit
      - name: Build production website
        run: npm run build

  telegram-bot-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Telegram bot syntax
        run: python -m py_compile telegram-admin-bot/bot.py
