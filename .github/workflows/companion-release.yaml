name: Build and Release Companion

on:
  push:
    branches:
      - master
    paths:
      - "companion/**"
      - ".github/workflows/companion-release.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Determine release version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_TAG=$(date -u +"%Y.%m.%d")
          VERSION="v${DATE_TAG}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile and package Companion for Windows, macOS, and Linux
        working-directory: companion
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go generate ./...
          mkdir -p dist

          echo "Building windows/amd64 (with PE .syso icon + manifest, unstripped for Defender)..."
          GOOS=windows GOARCH=amd64 go build \
            -ldflags="-H=windowsgui -X main.Version=${VERSION}" \
            -o dist/aniflix-companion-windows-amd64.exe .

          for ARCH in amd64 arm64; do
            echo "Building linux/${ARCH}..."
            GOOS=linux GOARCH=${ARCH} go build \
              -ldflags="-X main.Version=${VERSION}" \
              -o dist/aniflix-companion-linux-${ARCH} .

            LINUX_DIR="dist/aniflix-companion-linux-${ARCH}-bundle"
            mkdir -p "${LINUX_DIR}"
            cp "dist/aniflix-companion-linux-${ARCH}" "${LINUX_DIR}/aniflix-companion"
            chmod +x "${LINUX_DIR}/aniflix-companion"
            cp icon.png "${LINUX_DIR}/icon.png"
            cat > "${LINUX_DIR}/aniflix-companion.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=ANIFLIX Companion
          Comment=ANIFLIX Companion App
          Exec=./aniflix-companion
          Icon=icon.png
          Terminal=false
          Categories=AudioVideo;Video;
          EOF
            tar -czf "dist/aniflix-companion-linux-${ARCH}.tar.gz" -C dist "aniflix-companion-linux-${ARCH}-bundle"
            rm -rf "${LINUX_DIR}"
          done

          for ARCH in amd64 arm64; do
            echo "Building darwin/${ARCH} and packaging ANIFLIX Companion.app..."
            GOOS=darwin GOARCH=${ARCH} go build \
              -ldflags="-X main.Version=${VERSION}" \
              -o dist/aniflix-companion-darwin-${ARCH} .

            APP_DIR="dist/macos-${ARCH}/ANIFLIX Companion.app/Contents"
            mkdir -p "${APP_DIR}/MacOS" "${APP_DIR}/Resources"
            cp "dist/aniflix-companion-darwin-${ARCH}" "${APP_DIR}/MacOS/aniflix-companion"
            chmod +x "${APP_DIR}/MacOS/aniflix-companion"
            cp icon.icns "${APP_DIR}/Resources/icon.icns"
            cat > "${APP_DIR}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>aniflix-companion</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundleIdentifier</key>
            <string>network.aniflix.tamil.companion</string>
            <key>CFBundleName</key>
            <string>ANIFLIX Companion</string>
            <key>CFBundleDisplayName</key>
            <string>ANIFLIX Companion</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
            (cd "dist/macos-${ARCH}" && zip -r "../aniflix-companion-macos-${ARCH}.zip" "ANIFLIX Companion.app")
            rm -rf "dist/macos-${ARCH}"
          done

          cd dist
          sha256sum aniflix-companion-* > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-${{ steps.version.outputs.version }}
          name: ANIFLIX Companion ${{ steps.version.outputs.version }}
          make_latest: "true"
          generate_release_notes: true
          body: |
            ## ANIFLIX Companion (${{ steps.version.outputs.version }})

            Lightweight companion app for smooth, ad-free playback in the ANIFLIX player.

            ### Quick Start
            - **Windows**: Download and launch `aniflix-companion-windows-amd64.exe`.
            - **macOS**: Download `aniflix-companion-macos-arm64.zip` (Apple Silicon) or `aniflix-companion-macos-amd64.zip` (Intel), unzip, and open **ANIFLIX Companion.app** (if Gatekeeper prompts on first launch, right-click → **Open** or run `xattr -cr "ANIFLIX Companion.app"`).
            - **Linux**: Download `aniflix-companion-linux-amd64.tar.gz` (or the standalone binary) and run `./aniflix-companion`.
          files: |
            companion/dist/aniflix-companion-windows-amd64.exe
            companion/dist/aniflix-companion-macos-arm64.zip
            companion/dist/aniflix-companion-macos-amd64.zip
            companion/dist/aniflix-companion-linux-amd64.tar.gz
            companion/dist/aniflix-companion-linux-arm64.tar.gz
            companion/dist/aniflix-companion-linux-amd64
            companion/dist/aniflix-companion-linux-arm64
            companion/dist/aniflix-companion-darwin-amd64
            companion/dist/aniflix-companion-darwin-arm64
            companion/dist/checksums.txt
